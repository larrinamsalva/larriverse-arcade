name: Publish LarriVerse Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate complete arcade
        run: npm run validate

      - name: Verify committed human approval
        run: npm run verify:release-approval

      - name: Verify approved code ancestry
        shell: bash
        run: |
          APPROVED_COMMIT="$(node -p "JSON.parse(require('fs').readFileSync('docs/release-approval.json','utf8')).approvedCodeCommit")"
          git merge-base --is-ancestor "$APPROVED_COMMIT" HEAD

      - name: Install pinned browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser QA
        run: npx playwright test --config=playwright.config.mjs

      - name: Upload tagged browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larriverse-release-browser-qa-${{ github.ref_name }}
          path: |
            artifacts/screenshots/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify tag and release manifest
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          MANIFEST_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('release.json','utf8')).version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$PACKAGE_VERSION" = "$MANIFEST_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "LarriVerse Arcade $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE-NOTES-1.0.0.md \
            --verify-tag
