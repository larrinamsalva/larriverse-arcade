name: Browser QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser QA
        run: npx playwright test --config=playwright.config.mjs

      - name: Build offline gallery review pack
        if: success()
        env:
          LARRIVERSE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LARRIVERSE_RUN_ID: ${{ github.run_id }}
        run: node scripts/build-gallery-review.mjs

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larriverse-browser-qa-${{ github.run_number }}
          path: |
            artifacts/screenshots/
            artifacts/gallery-review/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload offline gallery review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: larriverse-gallery-review-${{ github.run_number }}
          path: artifacts/gallery-review/
          if-no-files-found: error
          retention-days: 30
