name: Deploy LarriVerse Arcade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: larriverse-pages
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate complete arcade and QA contracts
        run: npm run validate

      - name: Build allowlisted static preview and deployment identity
        run: npm run build:pages

      - name: Verify public artifact boundary
        shell: bash
        run: |
          test -f _site/deployment.json
          test -f _site/qa/readiness.html
          test -f _site/qa/evidence-preflight.html
          test ! -e _site/docs/release-approval.json
          test ! -e _site/scripts
          test ! -e _site/.github

      - name: Record deployment identity
        shell: bash
        run: |
          echo '### LarriVerse deployment identity' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat _site/deployment.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
